<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>德利廠庫存紀錄系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap');

:root{
  --paper:#FAF8F3;
  --panel:#FFFFFF;
  --ink:#22251F;
  --ink-soft:#5B5B4F;
  --line:#DEDACB;
  --line-strong:#B9B29B;
  --in:#1F6F5C;
  --in-bg:#E7F1EC;
  --out:#A6432B;
  --out-bg:#F5E9E3;
  --accent:#3D4B3D;
  --tag-bg:#EFEBDD;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans TC','Noto Sans Thai','Noto Sans','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px;}

.lang-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px;}
.lang-btn{
  padding:5px 12px;border:1px solid var(--line-strong);border-radius:20px;
  background:var(--panel);color:var(--ink-soft);cursor:pointer;
  font-size:12px;font-family:'IBM Plex Sans TC','Noto Sans Thai','Noto Sans',sans-serif;
}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.masthead{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:3px solid var(--ink);
  padding-bottom:16px;margin-bottom:22px;
  flex-wrap:wrap;gap:16px;
}
.masthead h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:0.5px;
  margin:0;
  text-transform:uppercase;
}
.masthead .sub{
  font-size:12.5px;color:var(--ink-soft);margin-top:4px;
  letter-spacing:0.3px;
}
.stat-row{display:flex;gap:22px;}
.stat{text-align:right;}
.stat .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1;}
.stat .label{font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;margin-top:3px;}

.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;}
@media (max-width:820px){.grid{grid-template-columns:1fr;}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;}
.panel-head{
  padding:12px 16px;border-bottom:1px solid var(--line);
  font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:0.8px;text-transform:uppercase;color:var(--accent);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.link-btn{
  background:none;border:none;color:var(--accent);cursor:pointer;
  font-family:'IBM Plex Sans TC','Noto Sans Thai','Noto Sans',sans-serif;font-size:11.5px;
  text-decoration:underline;font-weight:500;letter-spacing:0;text-transform:none;
}

.item-search{
  width:100%;padding:9px 12px;border:none;border-bottom:1px solid var(--line);
  font-size:13px;font-family:inherit;background:transparent;outline:none;
}
.item-list{max-height:600px;overflow-y:auto;}
.item-list-colhead{
  display:flex;justify-content:space-between;padding:6px 16px;
  font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);
  background:#F5F3EA;
}
.cat-header{
  padding:8px 16px 5px;font-family:'Oswald',sans-serif;font-size:11px;
  letter-spacing:0.6px;text-transform:uppercase;color:var(--ink-soft);
  background:var(--tag-bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line);
}
.item-row{
  padding:9px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.item-row:hover{background:#F5F3EA;}
.item-row.active{background:var(--accent);color:#fff;}
.item-row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item-row .qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;flex-shrink:0;}
.item-row .qty.neg{color:var(--out);}
.item-row.active .qty.neg{color:#F3C6B7;}
.empty-note{padding:20px 16px;color:var(--ink-soft);font-size:12.5px;}

.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel);}
.tab{
  padding:12px 18px;cursor:pointer;font-family:'Oswald',sans-serif;
  font-size:13px;letter-spacing:0.6px;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:3px solid transparent;font-weight:500;
}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}
.tab-body{padding:20px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;color:var(--ink-soft);letter-spacing:0.3px;}
.field input,.field select,.field textarea{
  padding:9px 10px;border:1px solid var(--line-strong);border-radius:2px;
  font-size:13.5px;font-family:inherit;background:var(--paper);outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent);}
.type-toggle{display:flex;gap:8px;}
.type-btn{
  flex:1;padding:10px;text-align:center;border:1.5px solid var(--line-strong);
  border-radius:2px;cursor:pointer;font-family:'Oswald',sans-serif;
  font-weight:600;letter-spacing:0.5px;color:var(--ink-soft);
}
.type-btn.in.sel{background:var(--in-bg);border-color:var(--in);color:var(--in);}
.type-btn.out.sel{background:var(--out-bg);border-color:var(--out);color:var(--out);}
.submit-row{margin-top:16px;display:flex;justify-content:flex-end;gap:10px;align-items:center;}
.btn{
  padding:10px 22px;border:none;border-radius:2px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.5px;
  font-size:13.5px;background:var(--accent);color:#fff;text-transform:uppercase;
}
.btn:hover{opacity:0.88;}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft);}
.btn.sm{padding:7px 14px;font-size:12px;}
.form-msg{font-size:12px;color:var(--in);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);
  font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:#FBFAF6;}
.pill{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.3px;
}
.pill.in{background:var(--in-bg);color:var(--in);}
.pill.out{background:var(--out-bg);color:var(--out);}
.batch-tag{
  font-family:'IBM Plex Mono',monospace;background:var(--tag-bg);
  padding:2px 7px;border-radius:2px;font-size:12px;
}
.cat-tag{
  font-family:'IBM Plex Sans TC','Noto Sans Thai','Noto Sans',sans-serif;background:#EAE6F2;color:#4B3F63;
  padding:2px 8px;border-radius:2px;font-size:11.5px;font-weight:500;
}
.qty-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.del-btn{
  background:none;border:none;color:var(--ink-soft);cursor:pointer;
  font-size:12px;text-decoration:underline;padding:0;
}
.del-btn:hover{color:var(--out);}
.edit-btn{
  background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:12px;text-decoration:underline;padding:0;
}
.edit-btn:hover{opacity:0.7;}
.filter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.filter-row select{padding:7px 10px;border:1px solid var(--line-strong);border-radius:2px;font-family:inherit;font-size:12.5px;background:var(--panel);}
.table-wrap{overflow-x:auto;}
.loading{padding:40px;text-align:center;color:var(--ink-soft);}
.toast{
  position:fixed;bottom:22px;right:22px;background:var(--accent);color:#fff;
  padding:10px 18px;border-radius:3px;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,0.2);
  opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(34,37,31,0.45);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:#fff;border-radius:3px;padding:22px;width:340px;
  box-shadow:0 8px 28px rgba(0,0,0,0.25);
}
.modal h3{
  font-family:'Oswald',sans-serif;font-size:16px;margin:0 0 14px;
  text-transform:uppercase;letter-spacing:0.4px;
}
.modal .field{margin-bottom:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">載入資料中…</div>
</div>
<div class="toast" id="toast"></div>

/* ============================================================
   把下面這個網址換成你自己部署的 Google Apps Script 網頁應用程式網址
   （部署步驟請看 GoogleAppsScript-Code.gs 檔案最上方的說明）
   換好之後，不管誰在什麼裝置打開這個網頁，看到的都是同一份
   Google 試算表資料。
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyMRVxtJQA2VW-sdiUs2WITyScblRvcJjDpYUziFsRxuitAnEKGBzC4Vv7c1Ql40S2q/exec';

async function apiGetAll(){
  const res = await fetch(`${API_URL}?action=getAll`);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({action}, payload))
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

function t(key, vars){
  let s = (T[lang] && T[lang][key]!==undefined) ? T[lang][key] : (T.zh[key]!==undefined ? T.zh[key] : key);
  if(vars){
    Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  }
  return s;
}
function setLang(l){
  lang = l;
  try{ localStorage.setItem('inv-lang', l); }catch(e){}
  render();
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function normalizeTx(tx){
  return {
    ...tx,
    qty: Number(tx.qty)||0,
    partialQty: (tx.partialQty===''||tx.partialQty===null||tx.partialQty===undefined) ? null : Number(tx.partialQty)
  };
}

async function loadData(){
  if(!API_URL || API_URL.indexOf('PASTE_YOUR_')===0){
    app.innerHTML = `<div style="padding:60px 24px;text-align:center;color:var(--out);max-width:520px;margin:0 auto;">
      <div style="font-family:'Oswald',sans-serif;font-size:18px;margin-bottom:10px;">${t('setupTitle')}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${t('setupBody')}</div>
    </div>`;
    return;
  }
  try{
    const data = await apiGetAll();
    transactions = (data.transactions||[]).map(normalizeTx);
    itemsMaster = data.items || [];

    if(itemsMaster.length===0){
      for(const it of DEFAULT_ITEMS){ await apiPost('addItem', {item: it}); }
      const data2 = await apiGetAll();
      transactions = (data2.transactions||[]).map(normalizeTx);
      itemsMaster = data2.items || [];
    }else{
      const existingNames = new Set(itemsMaster.map(i=>i.name));
      const missing = DEFAULT_ITEMS.filter(i=>!existingNames.has(i.name));
      if(missing.length>0){
        for(const it of missing){ await apiPost('addItem', {item: it}); }
        const data3 = await apiGetAll();
        transactions = (data3.transactions||[]).map(normalizeTx);
        itemsMaster = data3.items || [];
      }
    }
  }catch(e){
    app.innerHTML = `<div style="padding:60px 24px;text-align:center;color:var(--out);max-width:520px;margin:0 auto;">
      <div style="font-family:'Oswald',sans-serif;font-size:18px;margin-bottom:10px;">${t('connFailTitle')}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${t('connFailBody')}<br><span class="mono" style="font-size:11px;">${escapeHtml(e.message||'')}</span></div>
    </div>`;
    return;
  }
  render();
}

function categoryOrder(){
  const cats = [...new Set(itemsMaster.map(i=>i.category))];
  const ordered = DEFAULT_CATEGORY_ORDER.filter(c=>cats.includes(c));
  const rest = cats.filter(c=>!DEFAULT_CATEGORY_ORDER.includes(c)).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  return [...ordered, ...rest];
}

function stockOf(name){
  return transactions.filter(t=>t.item===name).reduce((s,t)=>s+(t.type==='in'?t.qty:-t.qty),0);
}
function unitOfItem(name){
  const itemTx = transactions.filter(t=>t.item===name && t.unit).slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  return itemTx.length>0 ? itemTx[itemTx.length-1].unit : '';
}
function itemsWithStock(){
  return itemsMaster.map(i=>({...i, stock: stockOf(i.name), unit: i.unit || unitOfItem(i.name)}));
}

function fmtQty(n){ return (n>0?'+':'') + n; }
function escapeAttr(s){ return (s==null?'':String(s)).replace(/"/g,'&quot;'); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        <div class="stat"><div class="num mono">${totalStock}</div><div class="label">${t('statStock')}</div></div>
        <div class="stat"><div class="num mono">${todayCount}</div><div class="label">${t('statToday')}</div></div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">

          ${t('itemListTitle')}
          <span style="display:flex;gap:10px;">
            <button class="link-btn" id="addItemLink">${t('addItem')}</button>
            <button class="link-btn" id="manageItemLink">${t('manageItem')}</button>
          </span>
        </div>
        <input class="item-search" id="itemSearch" placeholder="${escapeAttr(t('searchPlaceholder'))}" value="${escapeAttr(window.__itemSearchVal||'')}">
        <div class="item-list-colhead">
          <span>${t('colItem')}</span><span>${t('colBalance')}</span>
        </div>
        <div class="item-list" id="itemList"></div>
      </div>

      <div class="panel">
        <div class="tabs">
          <div class="tab ${activeTab==='entry'?'active':''}" data-tab="entry">${t('tabEntry')}</div>
          <div class="tab ${activeTab==='log'?'active':''}" data-tab="log">${t('tabLog')}</div>
          <div class="tab ${activeTab==='batch'?'active':''}" data-tab="batch">${t('tabBatch')}</div>

  });

    showAddItemModal = true; renderAddItemModal();
  });
  document.getElementById('manageItemLink').addEventListener('click', ()=>{
    showManageModal = true; renderManageModal();
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ activeTab = t.dataset.tab; render(); });
  });

  if(activeTab==='entry') renderEntryTab();
  else if(activeTab==='log') renderLogTab();
  else renderBatchTab();

  renderAddItemModal();
  renderManageModal();
  renderEditTxModal();
}

function renderItemList(items){
  const q = (window.__itemSearchVal||'').trim().toLowerCase();
  const filtered = items.filter(i=>i.name.toLowerCase().includes(q));
  const listEl = document.getElementById('itemList');
  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty-note">${t('noMatch')}</div>`;
    return;
  }
  const cats = categoryOrder();
  let html = '';
  cats.forEach(cat=>{
    const group = filtered.filter(i=>i.category===cat);
    if(group.length===0) return;
    html += `<div class="cat-header">${escapeHtml(categoryLabel(cat))}</div>`;
    html += group.map(i=>{
      const imgUrl = itemImageUrl(i.name);
      return `
      <div class="item-row ${selectedItem===i.name?'active':''}" data-item="${escapeAttr(i.name)}">
        <span class="nm" style="display:flex;align-items:center;gap:8px;overflow:hidden;">
          ${imgUrl ? `<img src="${escapeAttr(imgUrl)}" alt="" style="width:26px;height:26px;object-fit:cover;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,0.1);">` : ''}
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(itemDisplayName(i.name))}</span>
        </span>
        <span class="qty mono ${i.stock<0?'neg':''}">${fmtQty(i.stock)}${i.unit?' '+escapeHtml(i.unit):''}</span>
      </div>
    `;
    }).join('');
  });
  listEl.innerHTML = html || `<div class="empty-note">${t('noMatch')}</div>`;
  listEl.querySelectorAll('.item-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      selectedItem = row.dataset.item === selectedItem ? null : row.dataset.item;
      if(selectedItem) activeTab = 'batch';
      render();
    });
  });
}

        <label>${entryType==='out'?t('fieldOutDate'):t('fieldInDate')}</label>

      </div>
      <div class="field">
        <label>${t('fieldHandler')}</label>
        ${lang==='zh' ? `
        <select id="f_handler_select">
          <option value="">${t('selectPlaceholder')}</option>
          ${HANDLERS.map(h=>`<option value="${escapeAttr(h)}" ${handlerChoice===h?'selected':''}>${escapeHtml(handlerLabel(h))}</option>`).join('')}
          <option value="其他" ${handlerChoice==='其他'?'selected':''}>${t('other')}</option>
        </select>
        ${handlerChoice==='其他' ? `<input id="f_handler_other" placeholder="${escapeAttr(t('handlerOtherPlaceholder'))}" style="margin-top:6px;">` : ''}

        <select id="f_outcat_select">
          <option value="">${t('selectPlaceholder')}</option>
          ${OUT_CATEGORIES.map(c=>`<option value="${escapeAttr(c)}" ${outCatChoice===c?'selected':''}>${escapeHtml(outCatLabel(c))}</option>`).join('')}
          <option value="其他" ${outCatChoice==='其他'?'selected':''}>${t('other')}</option>

        ${outCatChoice==='其他' ? `<input id="f_outcat_other" placeholder="${escapeAttr(t('outCatPlaceholder'))}" style="margin-top:6px;" value="${escapeAttr(outCatFreeText)}">` : ''}
      </div>` : `<div class="field"></div>`}
      <div class="field full">
        <label>${t('fieldNote')}</label>

      </div>

  body.querySelectorAll('.type-btn').forEach(b=>{

      renderEntryTab();
    });
  }else{
    document.getElementById('f_handler_text').addEventListener('input', e=>{
      handlerFreeText = e.target.value;
    });
  }

    document.getElementById('f_outcat_select').addEventListener('change', e=>{
      outCatChoice = e.target.value;
      renderEntryTab();
    });

      document.getElementById('f_outcat_other').addEventListener('input', e=>{
        outCatFreeText = e.target.value;
      });
    }

  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    const item = document.getElementById('f_item').value;
    const batch = document.getElementById('f_batch').value;
    const date = document.getElementById('f_date').value;
    const qty = parseInt(document.getElementById('f_qty').value, 10);
    const unit = document.getElementById('f_unit').value;
    const partialRaw = document.getElementById('f_partial').value;
    const partialQty = partialRaw==='' ? null : parseInt(partialRaw, 10);
    const handler = lang==='zh'
      ? (handlerChoice==='其他' ? (document.getElementById('f_handler_other')?.value.trim() || '') : handlerChoice)
      : (document.getElementById('f_handler_text')?.value.trim() || '');
    const outCategory = entryType==='out'
      ? (outCatChoice==='其他' ? (document.getElementById('f_outcat_other')?.value.trim() || '') : outCatChoice)
      : '';

      msgEl.style.color = 'var(--out)';

      return;
    }

    const tx = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      item, batch, date, type: entryType, qty, unit, partialQty, handler, outCategory, note,
      createdAt: new Date().toISOString()
    };
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    try{
      await apiPost('addTx', {tx});
      selectedItem = item;
      showToast(entryType==='in' ? t('txSuccessIn') : t('txSuccessOut'));
      await loadData();
    }catch(e){
      submitBtn.disabled = false;
      showToast(t('saveFail'));
    }
  });
}

/* ================= BATCH / EXPIRY TAB ================= */
function renderBatchTab(){
  const body = document.getElementById('tabBody');
  const items = itemsWithStock();
  const cats = categoryOrder();

  if(!selectedItem){
    let html = `<div style="margin-bottom:14px;color:var(--ink-soft);font-size:13px;">${t('batchIntro')}</div>`;
    html += `<div class="table-wrap"><table><thead><tr><th>${t('colCategory')}</th><th>${t('colItem')}</th><th>${t('colCurrentStock')}</th><th>${t('colUnit')}</th></tr></thead><tbody>`;
    cats.forEach(cat=>{
      items.filter(i=>i.category===cat).forEach(i=>{
        html += `<tr data-item="${escapeAttr(i.name)}" style="cursor:pointer;"><td><span class="cat-tag">${escapeHtml(cat)}</span></td><td>${escapeHtml(itemDisplayName(i.name))}</td><td class="qty-cell mono">${fmtQty(i.stock)}</td><td class="mono">${escapeHtml(i.unit)||'—'}</td></tr>`;
      });
    });
    html += `</tbody></table></div>`;
    body.innerHTML = html;
    body.querySelectorAll('tr[data-item]').forEach(row=>{
      row.addEventListener('click', ()=>{ selectedItem = row.dataset.item; render(); });
    });
    return;
  }

  const itemInfo = itemsMaster.find(i=>i.name===selectedItem) || {};
  const itemTx = transactions.filter(t=>t.item===selectedItem);
  const batchMap = {};
  itemTx.forEach(tx=>{
    const key = tx.batch || t('noExpiryFilled');
    if(!batchMap[key]) batchMap[key] = {in:0,out:0,lastDate:'',outCats:{},units:{}};
    if(tx.type==='in') batchMap[key].in += tx.qty; else batchMap[key].out += tx.qty;
    if(tx.date > batchMap[key].lastDate) batchMap[key].lastDate = tx.date;
    if(tx.type==='out' && tx.outCategory) batchMap[key].outCats[tx.outCategory]=true;
    if(tx.unit) batchMap[key].units[tx.unit]=true;
  });
  const batchRows = Object.keys(batchMap).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const currentStock = itemTx.reduce((s,tx)=>s+(tx.type==='in'?tx.qty:-tx.qty),0);
  const currentUnit = unitOfItem(selectedItem);

  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;align-items:center;gap:12px;">
        ${itemImageUrl(selectedItem) ? `<img src="${escapeAttr(itemImageUrl(selectedItem))}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0;">` : ''}
        <div>
          <div style="font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;">${escapeHtml(itemDisplayName(selectedItem))} ${itemInfo.category?`<span class="cat-tag" style="vertical-align:middle;">${escapeHtml(itemInfo.category)}</span>`:''}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${t('currentStockLabel')}<span class="mono" style="font-weight:600;color:${currentStock<0?'var(--out)':'var(--in)'}">${fmtQty(currentStock)}${currentUnit?' '+escapeHtml(currentUnit):''}</span></div>
        </div>
      </div>
      <button class="btn ghost sm" id="clearSelBtn">${t('backToAll')}</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>${t('fieldExpiry')}</th><th>${t('colBatchIn')}</th><th>${t('colBatchOut')}</th><th>${t('colBalanceShort')}</th><th>${t('colUnit')}</th><th>${t('colLastDate')}</th><th>${t('colOutCat')}</th></tr></thead>
      <tbody>
        ${batchRows.length===0 ? `<tr><td colspan="7" style="color:var(--ink-soft);padding:20px 10px;">${t('noBatchTx')}</td></tr>` :
        batchRows.map(b=>{
          const d = batchMap[b];
          const bal = d.in - d.out;
          return `<tr>
            <td><span class="batch-tag">${escapeHtml(b)}</span></td>
            <td class="qty-cell mono" style="color:var(--in)">+${d.in}</td>
            <td class="qty-cell mono" style="color:var(--out)">-${d.out}</td>
            <td class="qty-cell mono" style="font-weight:700;">${fmtQty(bal)}</td>
            <td class="mono">${Object.keys(d.units).join('、')||'—'}</td>
            <td class="mono">${d.lastDate}</td>
            <td>${Object.keys(d.outCats).map(outCatLabel).join('、')||'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  `;
  document.getElementById('clearSelBtn').addEventListener('click', ()=>{
    selectedItem = null; render();
  });
}

/* ================= ADD ITEM MODAL ================= */
function renderAddItemModal(){
  let existing = document.getElementById('addItemModalRoot');
  if(existing) existing.remove();
  if(!showAddItemModal) return;

  const cats = categoryOrder();
  const root = document.createElement('div');
  root.id = 'addItemModalRoot';
  root.innerHTML = `
    <div class="modal-backdrop" id="addItemBackdrop">
      <div class="modal">
        <h3>${t('addItemModalTitle')}</h3>
        <div class="field">
          <label>${t('fieldItemName')}</label>
          <input id="m_name" placeholder="${escapeAttr(t('itemNamePlaceholder'))}">
        </div>
        <div class="field">
          <label>${t('fieldCategory')}</label>
          <input id="m_cat" list="addItemCatList" placeholder="${escapeAttr(t('categoryPlaceholder'))}" value="${escapeAttr(cats[0]||'')}">
          <datalist id="addItemCatList">${cats.map(c=>`<option value="${escapeAttr(c)}">`).join('')}</datalist>
        </div>
        <div class="field">
          <label>${t('fieldUnit')}</label>
          <select id="m_unit">
            <option value="">${t('unitUnset')}</option>
            ${UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn ghost sm" id="m_cancel">${t('cancel')}</button>
          <button class="btn sm" id="m_save">${t('add')}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(root);

  document.getElementById('addItemBackdrop').addEventListener('click', e=>{
    if(e.target.id==='addItemBackdrop'){ showAddItemModal=false; renderAddItemModal(); }
  });
  document.getElementById('m_cancel').addEventListener('click', ()=>{ showAddItemModal=false; renderAddItemModal(); });
  document.getElementById('m_save').addEventListener('click', async ()=>{
    const name = document.getElementById('m_name').value.trim();
    const cat = document.getElementById('m_cat').value.trim() || '未分類';
    const unit = document.getElementById('m_unit').value;
    if(!name){ return; }
    if(itemsMaster.some(i=>i.name===name)){
      showToast(t('itemExists'));
      return;
    }
    try{
      const res = await apiPost('addItem', {item:{name, category:cat, unit}});
      if(res && res.success===false){
        showToast(res.error==='exists' ? t('itemExists') : t('addFail'));
        return;
      }
      showAddItemModal = false;
      selectedItem = name;
      showToast(t('itemAdded'));
      await loadData();
    }catch(e){
      showToast(t('addFailNetwork'));
    }
  });
}

/* ================= MANAGE (EDIT/DELETE) ITEMS MODAL ================= */
function renderManageModal(){
  let existing = document.getElementById('manageModalRoot');
  if(existing) existing.remove();
  if(!showManageModal) return;

  const cats = categoryOrder();
  const root = document.createElement('div');
  root.id = 'manageModalRoot';
  root.innerHTML = `
    <div class="modal-backdrop" id="manageModalBackdrop">
      <div class="modal" style="width:560px;max-width:92vw;max-height:80vh;overflow-y:auto;">
        <h3>${t('manageModalTitle')}</h3>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">${t('manageSubtitle')}</div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>${t('fieldItemName')}</th><th>${t('colCategory')}</th><th>${t('fieldUnit')}</th><th></th></tr></thead>
          <tbody>
            ${itemsMaster.map((it,idx)=>`
              <tr>
                <td><input class="mgr-name" data-idx="${idx}" value="${escapeAttr(it.name)}" style="width:100%;padding:6px 7px;border:1px solid var(--line-strong);border-radius:2px;font-size:12.5px;font-family:inherit;"></td>
                <td><input class="mgr-cat" data-idx="${idx}" value="${escapeAttr(it.category)}" list="mgrCatList" style="width:100%;padding:6px 7px;border:1px solid var(--line-strong);border-radius:2px;font-size:12.5px;font-family:inherit;"></td>
                <td>
                  <select class="mgr-unit" data-idx="${idx}" style="width:100%;padding:6px 7px;border:1px solid var(--line-strong);border-radius:2px;font-size:12.5px;font-family:inherit;">
                    <option value="" ${!it.unit?'selected':''}>${t('unitUnset')}</option>
                    ${UNITS.map(u=>`<option value="${u}" ${it.unit===u?'selected':''}>${u}</option>`).join('')}
                  </select>
                </td>
                <td style="white-space:nowrap;">
                  <button class="link-btn mgr-save" data-idx="${idx}">${t('save')}</button>
                  <button class="link-btn mgr-del" data-idx="${idx}" style="color:var(--out);margin-left:8px;">${t('delete')}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
        <datalist id="mgrCatList">${cats.map(c=>`<option value="${escapeAttr(c)}">`).join('')}</datalist>
        <div class="modal-actions">
          <button class="btn ghost sm" id="mgr_close">${t('close')}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(root);

  document.getElementById('manageModalBackdrop').addEventListener('click', e=>{
    if(e.target.id==='manageModalBackdrop'){ showManageModal=false; renderManageModal(); }
  });
  document.getElementById('mgr_close').addEventListener('click', ()=>{
    showManageModal=false; renderManageModal();
  });

  root.querySelectorAll('.mgr-save').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const nameInput = root.querySelector(`.mgr-name[data-idx="${idx}"]`);
      const catInput = root.querySelector(`.mgr-cat[data-idx="${idx}"]`);
      const unitInput = root.querySelector(`.mgr-unit[data-idx="${idx}"]`);
      const newName = nameInput.value.trim();
      const newCat = catInput.value.trim() || '未分類';
      const newUnit = unitInput.value;
      if(!newName){ showToast(t('nameEmpty')); return; }
      const oldItem = itemsMaster[idx];
      if(!oldItem) return;
      if(newName!==oldItem.name && itemsMaster.some((it,i)=>i!==idx && it.name===newName)){
        showToast(t('nameDuplicate'));
        return;
      }
      const oldName = oldItem.name;
      try{
        const res = await apiPost('updateItem', {oldName, item:{name:newName, category:newCat, unit:newUnit}});
        if(res && res.success===false){
          showToast(t('updateFail')+(res.error||''));
          return;
        }
        if(selectedItem===oldName) selectedItem = newName;
        showToast(t('itemUpdated'));
        await loadData();
      }catch(e){
        showToast(t('updateFailNetwork'));
      }
    });
  });

  root.querySelectorAll('.mgr-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const it = itemsMaster[idx];
      if(!it) return;
      const txCount = transactions.filter(tx=>tx.item===it.name).length;
      const msg = txCount>0
        ? t('confirmDeleteItemWithTx', {name: it.name, count: txCount})
        : t('confirmDeleteItem', {name: it.name});
      if(!confirm(msg)) return;
      try{
        await apiPost('deleteItem', {name: it.name});
        if(selectedItem===it.name) selectedItem = null;
        showToast(t('itemDeleted'));
        await loadData();
      }catch(e){
        showToast(t('deleteFailNetwork'));
      }
    });
  });
}

/* ================= EDIT TRANSACTION MODAL ================= */
function captureEditTxForm(){
  if(!editingTx) return;
  const get = id => document.getElementById(id);
  if(get('et_item')) editingTx.item = get('et_item').value;
  if(get('et_batch')) editingTx.batch = get('et_batch').value;
  if(get('et_date')) editingTx.date = get('et_date').value;
  if(get('et_qty')) editingTx.qty = get('et_qty').value;
  if(get('et_unit')) editingTx.unit = get('et_unit').value;
  if(get('et_partial')) editingTx.partialQty = get('et_partial').value;
  if(get('et_handler_select')){
    const v = get('et_handler_select').value;
    editingTx._handlerChoice = v;
    editingTx.handler = v==='其他' ? (get('et_handler_other')?.value || '') : v;
  }
  if(get('et_handler_text')){
    editingTx.handler = get('et_handler_text').value;
  }
  if(get('et_outcat_select')){
    const v = get('et_outcat_select').value;
    editingTx._outCatChoice = v;
    editingTx.outCategory = v==='其他' ? (get('et_outcat_other')?.value || '') : v;
  }
  if(get('et_note')) editingTx.note = get('et_note').value;
}

function renderEditTxModal(){
  let existing = document.getElementById('editTxModalRoot');
  if(existing) existing.remove();
  if(!editingTx) return;

  const tx = editingTx;
  const cats = categoryOrder();
  const isHandlerKnown = HANDLERS.includes(tx.handler);
  const handlerChoiceVal = tx._handlerChoice!==undefined ? tx._handlerChoice : (tx.handler ? (isHandlerKnown ? tx.handler : '其他') : '');
  const isOutCatKnown = OUT_CATEGORIES.includes(tx.outCategory);
  const outCatChoiceVal = tx._outCatChoice!==undefined ? tx._outCatChoice : (tx.outCategory ? (isOutCatKnown ? tx.outCategory : '其他') : '');

  const root = document.createElement('div');
  root.id = 'editTxModalRoot';
  root.innerHTML = `
    <div class="modal-backdrop" id="editTxBackdrop">
      <div class="modal" style="width:480px;max-width:92vw;max-height:85vh;overflow-y:auto;">
        <h3>${t('editTxModalTitle')}</h3>
        <div class="type-toggle" style="margin-bottom:14px;">
          <div class="type-btn in ${tx.type==='in'?'sel':''}" id="et_type_in">${t('typeIn')}</div>
          <div class="type-btn out ${tx.type==='out'?'sel':''}" id="et_type_out">${t('typeOut')}</div>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldItemName')}</label>
          <select id="et_item">
            ${cats.map(cat=>`
              <optgroup label="${escapeAttr(categoryLabel(cat))}">
                ${itemsMaster.filter(i=>i.category===cat).map(i=>`<option value="${escapeAttr(i.name)}" ${tx.item===i.name?'selected':''}>${escapeHtml(itemDisplayName(i.name))}</option>`).join('')}
              </optgroup>
            `).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldExpiry')}</label>
          <input type="date" id="et_batch" value="${escapeAttr(tx.batch||'')}">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${tx.type==='out'?t('fieldOutDate'):t('fieldInDate')}</label>
          <input type="date" id="et_date" value="${escapeAttr(tx.date||'')}">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldQty')}</label>
          <div style="display:flex;gap:6px;">
            <input type="number" id="et_qty" min="0" step="1" value="${escapeAttr(tx.qty!=null?tx.qty:'')}" style="flex:1;">
            <select id="et_unit" style="width:82px;flex-shrink:0;">
              ${UNITS.map(u=>`<option value="${u}" ${tx.unit===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldPartial')}</label>
          <input type="number" id="et_partial" min="0" step="1" value="${(tx.partialQty!==null && tx.partialQty!==undefined && tx.partialQty!=='')?escapeAttr(tx.partialQty):''}" placeholder="${escapeAttr(t('partialPlaceholderShort'))}">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldHandler')}</label>
          ${lang==='zh' ? `
          <select id="et_handler_select">
            <option value="">${t('selectPlaceholder')}</option>
            ${HANDLERS.map(h=>`<option value="${escapeAttr(h)}" ${handlerChoiceVal===h?'selected':''}>${escapeHtml(handlerLabel(h))}</option>`).join('')}
            <option value="其他" ${handlerChoiceVal==='其他'?'selected':''}>${t('other')}</option>
          </select>
          ${handlerChoiceVal==='其他' ? `<input id="et_handler_other" placeholder="${escapeAttr(t('handlerOtherPlaceholder'))}" value="${escapeAttr(tx.handler||'')}" style="margin-top:6px;">` : ''}
          ` : `
          <input id="et_handler_text" value="${escapeAttr(tx.handler||'')}" placeholder="${escapeAttr(t('handlerOtherPlaceholder'))}">
          `}
        </div>
        ${tx.type==='out' ? `
        <div class="field" style="margin-bottom:12px;">
          <label>${t('fieldOutCat')}</label>
          <select id="et_outcat_select">
            <option value="">${t('selectPlaceholder')}</option>
            ${OUT_CATEGORIES.map(c=>`<option value="${escapeAttr(c)}" ${outCatChoiceVal===c?'selected':''}>${escapeHtml(outCatLabel(c))}</option>`).join('')}
            <option value="其他" ${outCatChoiceVal==='其他'?'selected':''}>${t('other')}</option>
          </select>
          ${outCatChoiceVal==='其他' ? `<input id="et_outcat_other" placeholder="${escapeAttr(t('outCatPlaceholder'))}" value="${escapeAttr(tx.outCategory||'')}" style="margin-top:6px;">` : ''}
        </div>` : ''}
        <div class="field" style="margin-bottom:14px;">
          <label>${t('fieldNoteShort')}</label>
          <input id="et_note" value="${escapeAttr(tx.note||'')}">
        </div>
        <div class="modal-actions">
          <button class="btn ghost sm" id="et_cancel">${t('cancel')}</button>
          <button class="btn sm" id="et_save">${t('saveEdit')}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(root);

  document.getElementById('editTxBackdrop').addEventListener('click', e=>{
    if(e.target.id==='editTxBackdrop'){ editingTx=null; renderEditTxModal(); }
  });
  document.getElementById('et_cancel').addEventListener('click', ()=>{ editingTx=null; renderEditTxModal(); });
  document.getElementById('et_type_in').addEventListener('click', ()=>{
    captureEditTxForm(); editingTx.type='in'; renderEditTxModal();
  });
  document.getElementById('et_type_out').addEventListener('click', ()=>{
    captureEditTxForm(); editingTx.type='out'; renderEditTxModal();
  });
  if(lang==='zh'){
    document.getElementById('et_handler_select').addEventListener('change', ()=>{
      captureEditTxForm(); renderEditTxModal();
    });
  }
  if(tx.type==='out'){
    document.getElementById('et_outcat_select').addEventListener('change', ()=>{
      captureEditTxForm(); renderEditTxModal();
    });
  }

  document.getElementById('et_save').addEventListener('click', async ()=>{
    captureEditTxForm();
    const item = editingTx.item;
    const date = editingTx.date;
    const qty = parseInt(editingTx.qty, 10);
    if(!item || !date || !qty || qty<=0){
      showToast(t('validateEditTx'));
      return;
    }
    const original = transactions.find(tx=>tx.id===editingTx.id);
    if(!original){ editingTx=null; renderEditTxModal(); return; }
    const partialRaw = editingTx.partialQty;
    const partialQty = (partialRaw===null || partialRaw===undefined || partialRaw==='') ? null : parseInt(partialRaw, 10);
    const updatedTx = {
      ...original,
      item, batch: editingTx.batch||'', date, type: editingTx.type,
      qty, unit: editingTx.unit, partialQty,
      handler: editingTx.handler||'',
      outCategory: editingTx.type==='out' ? (editingTx.outCategory||'') : '',
      note: editingTx.note||''
    };
    try{
      await apiPost('updateTx', {tx: updatedTx});
      editingTx = null;
      showToast(t('txUpdated'));
      await loadData();
    }catch(e){
      showToast(t('updateFailNetwork'));
    }
  });
}

loadData();
</script>
</body>
</html>
